# The root app is an npm project; only artifacts/* are pnpm projects. This file
# exists so `pnpm --filter <artifact> run <script>` resolves from the repo root
# (that is how the platform runs artifact dev/build commands).
#
# Artifact dependencies are installed in isolation by
# scripts/install-artifact-deps.sh (`pnpm install --ignore-workspace` inside
# each artifact), because a workspace-wide pnpm install would take over the
# npm-managed root node_modules. As a result the catalog below is NOT resolved
# during artifact installs: artifact package.json files must pin real version
# ranges and must not use `catalog:` specifiers.
packages:
  - 'artifacts/*'

catalog:
  '@replit/vite-plugin-cartographer': ^0.4.4
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.3
  '@tailwindcss/vite': ^4.1.14
  '@types/node': 20.19.27
  '@types/react': ^18.3.11
  '@types/react-dom': ^18.3.1
  '@vitejs/plugin-react': ^4.7.0
  clsx: ^2.1.1
  framer-motion: ^11.13.1
  lucide-react: ^0.453.0
  react: ^18.3.1
  react-dom: ^18.3.1
  tailwind-merge: ^2.6.0
  tailwindcss: ^4.1.14
  vite: ^7.3.0
