kind = "video"
previewPath = "/"
title = "Excellence Blueprint animated explainer"
description = "A ~3-minute animated motion-graphics film retelling The Livaware Excellence Blueprint — the standard-of-care field guide for nurses — with voice-over narration and a subtle music bed, in Livaware's navy/gold blueprint brand style."
version = "1.0.0"
id = "artifacts/excellence-blueprint"
router = "path"

# IMPORTANT: this artifact is workspace-only (a source project for rendering
# the portal welcome film). It must claim NO paths in production: the film is
# delivered to nurses as /videos/excellence-blueprint.mp4 served by the main
# app, which owns the entire published domain. When this artifact claimed "/"
# with a catch-all rewrite it shadowed the whole site, including /api and the
# nurse portal.
[[services]]
name = "web"
paths = [ ]
localPort = 21027

[services.development]
run = "pnpm --filter @workspace/excellence-blueprint run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/excellence-blueprint", "run", "build" ]
serve = "static"
publicDir = "artifacts/excellence-blueprint/dist/public"

[services.env]
PORT = "21027"
BASE_PATH = "/"
